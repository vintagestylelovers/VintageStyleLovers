<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VINTAGE STYLE LOVERS | AUTHENTIC MOTORS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;700&display=swap');
        :root { --dark: #0a0a0a; --charcoal: #151515; --accent: #e63946; --gold: #d4af37; --text: #f1f1f1; --dim: #888; }
        body { background-color: var(--dark); color: var(--text); font-family: 'Oswald', sans-serif; margin: 0; padding: 0; line-height: 1.6; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: rgba(10, 10, 10, 0.95); border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 1000; }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; color: var(--accent); letter-spacing: 4px; text-decoration: none; text-transform: uppercase; }
        .nav-links a { color: var(--text); text-decoration: none; margin-left: 30px; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        .nav-links a:hover { color: var(--accent); }
        
        header { text-align: center; padding: 120px 20px; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1614162692292-7ac56d7f7f1e?auto=format&fit=crop&w=1950&q=80'); background-size: cover; background-position: center; }
        h1 { font-family: 'Bebas Neue', sans-serif; font-size: 6rem; margin: 0; color: #fff; text-transform: uppercase; letter-spacing: 5px; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); }
        .subtitle { color: var(--gold); font-size: 1.2rem; letter-spacing: 5px; text-transform: uppercase; text-shadow: 1px 1px 5px rgba(0,0,0,0.8); }
        .container { max-width: 1200px; margin: 0 auto; padding: 60px 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 40px; }
        .card { background: var(--charcoal); border: 1px solid #222; padding: 20px; transition: all 0.4s ease; display: flex; flex-direction: column; justify-content: space-between; }
        .card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .card img { width: 100%; height: 260px; object-fit: contain; background: #000; margin-bottom: 15px; }
        .card h3 { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; margin: 0 0 10px 0; }
        .price-tag { color: var(--accent); font-size: 1.3rem; font-weight: bold; margin-bottom: 10px; }
        
        .size-select { width: 100%; padding: 8px; background: #222; color: #fff; border: 1px solid #444; margin-bottom: 10px; font-family: 'Oswald', sans-serif; }
        .size-guide-toggle { font-size: 0.85rem; color: var(--gold); cursor: pointer; text-decoration: underline; margin-bottom: 15px; display: inline-block; }
        .size-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 0.85rem; background: #111; }
        .size-table th, .size-table td { border: 1px solid #333; padding: 6px; text-align: center; }
        .size-table th { background: #222; color: var(--accent); }

        .btn-order { display: block; background: var(--accent); color: #fff; padding: 12px; text-align: center; text-decoration: none; font-weight: bold; text-transform: uppercase; border: none; width: 100%; cursor: pointer; }
        .btn-order:hover { background: #fff; color: var(--accent); }
        footer { text-align: center; padding: 60px; background: #050505; color: var(--dim); border-top: 1px solid #222; }
    </style>
</head>
<body>
<nav>
    <a href="#" class="logo">Vintage Style Lovers</a>
    <div class="nav-links">
        <a href="#">Home</a>
        <a href="https://www.tiktok.com/@vintagestylelovers" target="_blank">TikTok</a>
        <a href="mailto:info@vintagestylelovers.com">Contact</a>
    </div>
</nav>
<header>
    <p class="subtitle">Premium Apparel for Automotive Souls</p>
    <h1>APPAREL FOR OILHEADS</h1>
</header>
<div class="container">
    <div class="grid" id="productGrid"></div>
</div>

<script>
    const myIban = "IT00 X000 0000 0000 0000 0000 000";
    const products = [
        { name: "Garage Design 01", img: "https://images.teepublic.com/derived/production/designs/95594057_0/1783699091/i_m:bi_production_blanks_rpopxchk3mdhnbl4rwqm_1571669490,c_38_23_401x,bps_ba,s_630,q_90.jpg" },
        { name: "Garage Design 02", img: "https://images.teepublic.com/derived/production/designs/94808190_0/1782484356/i_m:bi_production_blanks_wbgkjvhmjc1emvm9yerh_1535405114,c_47_20_378x,bps_ba,s_630,q_90.jpg" },
        // ... (aggiungi qui gli altri prodotti come nell'esempio precedente)
    ];

    const grid = document.getElementById('productGrid');
    
    products.forEach((p, index) => {
        grid.innerHTML += `
            <div class="card">
                <div>
                    <img src="${p.img}" alt="${p.name}">
                    <h3>${p.name}</h3>
                    <div class="price-tag">€ 34.99</div>
                </div>
                <div>
                    <label>Select Size:</label>
                    <select id="size-${index}" class="size-select">
                        <option value="S">Size S</option><option value="M">Size M</option><option value="L" selected>Size L</option><option value="XL">Size XL</option><option value="XXL">Size XXL</option>
                    </select>
                    <details>
                        <summary class="size-guide-toggle">Size Guide</summary>
                        <table class="size-table">
                            <tr><th>Size</th><th>Chest</th><th>Length</th></tr>
                            <tr><td>S</td><td>48cm</td><td>70cm</td></tr><tr><td>M</td><td>52cm</td><td>72cm</td></tr><tr><td>L</td><td>56cm</td><td>74cm</td></tr><tr><td>XL</td><td>60cm</td><td>76cm</td></tr><tr><td>XXL</td><td>64cm</td><td>78cm</td></tr>
                        </table>
                    </details>
                    <button class="btn-order" onclick="proceedOrder('${p.name}', 'size-${index}')">PROCEED TO CHECKOUT</button>
                </div>
            </div>
        `;
    });

    function proceedOrder(productName, selectId) {
        const size = document.getElementById(selectId).value;
        alert("To complete your order for " + productName + " (Size: " + size + "):\n\n" +
              "Total due: € 41.99 (Incl. Shipping)\n\n" +
              "Please perform a bank transfer to this IBAN:\n" + myIban + "\n\n" +
              "Reference: " + productName + " - " + size + "\n\n" +
              "After payment, please email the receipt to: info@vintagestylelovers.com");
    }
</script>
<footer>&copy; 2026 Vintage Style Lovers - DRIVE LIKE A LEGEND</footer>
</body>
</html>
