<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VINTAGE GARAGE | AUTHENTIC MOTORS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Courier+Prime&display=swap');

        :root {
            --dark: #050505; --accent: #d00000; --gold: #c5a059; --text: #e0e0e0;
        }

        body { background-color: var(--dark); color: var(--text); font-family: 'Courier Prime', monospace; margin: 0; padding: 0; }
        
        /* Navigation */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; border-bottom: 1px solid #333; position: sticky; top: 0; background: rgba(5,5,5,0.95); z-index: 100; }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--accent); letter-spacing: 3px; text-decoration: none; }
        .nav-links a { color: var(--text); text-decoration: none; margin-left: 20px; font-size: 0.9rem; text-transform: uppercase; }
        .nav-links a:hover { color: var(--accent); }

        header { text-align: center; padding: 80px 20px; background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://www.transparenttextures.com/patterns/carbon-fibre.png'); }
        h1 { font-family: 'Bebas Neue', sans-serif; font-size: 5rem; margin: 0; color: #fff; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; padding: 50px 5%; }
        
        .card { background: #111; border: 1px solid #222; padding: 15px; transition: 0.4s; }
        .card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .card img { width: 100%; height: 320px; object-fit: contain; background: #000; }
        .card h3 { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; margin: 15px 0; }
        
        .btn-order { display: block; background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 10px; text-align: center; text-decoration: none; font-weight: bold; text-transform: uppercase; }
        .btn-order:hover { background: var(--accent); color: white; }

        footer { text-align: center; padding: 50px; border-top: 1px solid #333; font-size: 0.8rem; }
    </style>
</head>
<body>

<nav>
    <a href="#" class="logo">VINTAGE GARAGE</a>
    <div class="nav-links">

        <a href="mailto:your@email.com">Contact</a>
    </div>
</nav>
